name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build-test-synth:
    name: Build, test, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci

      # Synth needs no AWS credentials: stacks are environment-agnostic until deploy.
      - name: cdk synth
        run: npx cdk synth --quiet
