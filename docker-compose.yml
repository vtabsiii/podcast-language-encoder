# Local development dependencies only. Production uses Aurora PostgreSQL Serverless v2 and private S3.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polycast
      POSTGRES_PASSWORD: polycast
      POSTGRES_DB: polycast
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polycast']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: polycast
      MINIO_ROOT_PASSWORD: polycastpolycast
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

volumes:
  pgdata:
  miniodata:
